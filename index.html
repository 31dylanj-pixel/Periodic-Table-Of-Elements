<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Periodic Table</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <main class="page">

        <header class="header">
            <div>
                <p class="eyebrow">CHEMISTRY</p>
                <h1>Periodic Table</h1>
                <p class="subtitle">
                    Explore the elements of the periodic table.
                </p>
            </div>

            <div class="element-count">
                <strong>118</strong>
                <span>Elements</span>
            </div>
        </header>


        <section class="table-section">

            <div class="periodic-table" id="periodic-table">
                <!-- Generated by JavaScript -->
            </div>

            <div class="series-container">

                <div class="series-label">
                    <span>Lanthanides</span>
                </div>

                <div class="series-row" id="lanthanides">
                    <!-- Generated by JavaScript -->
                </div>


                <div class="series-label">
                    <span>Actinides</span>
                </div>

                <div class="series-row" id="actinides">
                    <!-- Generated by JavaScript -->
                </div>

            </div>

        </section>


        <section class="legend">

            <div class="legend-title">
                Element Categories
            </div>

            <div class="legend-items">

                <div class="legend-item">
                    <span class="legend-dot alkali-metal"></span>
                    Alkali Metal
                </div>

                <div class="legend-item">
                    <span class="legend-dot alkaline-earth-metal"></span>
                    Alkaline Earth Metal
                </div>

                <div class="legend-item">
                    <span class="legend-dot transition-metal"></span>
                    Transition Metal
                </div>

                <div class="legend-item">
                    <span class="legend-dot post-transition-metal"></span>
                    Post-transition Metal
                </div>

                <div class="legend-item">
                    <span class="legend-dot metalloid"></span>
                    Metalloid
                </div>

                <div class="legend-item">
                    <span class="legend-dot nonmetal"></span>
                    Nonmetal
                </div>

                <div class="legend-item">
                    <span class="legend-dot halogen"></span>
                    Halogen
                </div>

                <div class="legend-item">
                    <span class="legend-dot noble-gas"></span>
                    Noble Gas
                </div>

                <div class="legend-item">
                    <span class="legend-dot lanthanide"></span>
                    Lanthanide
                </div>

                <div class="legend-item">
                    <span class="legend-dot actinide"></span>
                    Actinide
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
